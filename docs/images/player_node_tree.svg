<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Player Scene Node Tree</title>
  <desc id="desc">A diagram of the player scene hierarchy, showing CharacterBody3D, collision, head, camera, raycast, and weapon preview.</desc>
  <rect width="900" height="520" fill="#f4f4f2"/>
  <text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#222">Player Scene Structure</text>
  <g font-family="Arial, sans-serif" font-size="20">
    <rect x="330" y="75" width="240" height="54" rx="6" fill="#4f8ad9" stroke="#173b6d" stroke-width="3"/>
    <text x="450" y="109" text-anchor="middle" fill="#fff">Player CharacterBody3D</text>
    <line x1="450" y1="129" x2="250" y2="175" stroke="#333" stroke-width="3"/>
    <line x1="450" y1="129" x2="560" y2="175" stroke="#333" stroke-width="3"/>
    <rect x="105" y="175" width="290" height="54" rx="6" fill="#7b8b8f" stroke="#30383a" stroke-width="3"/>
    <text x="250" y="209" text-anchor="middle" fill="#fff">CollisionShape3D Capsule</text>
    <rect x="455" y="175" width="210" height="54" rx="6" fill="#7b8b8f" stroke="#30383a" stroke-width="3"/>
    <text x="560" y="209" text-anchor="middle" fill="#fff">Head Node3D</text>
    <line x1="560" y1="229" x2="560" y2="275" stroke="#333" stroke-width="3"/>
    <rect x="455" y="275" width="210" height="54" rx="6" fill="#4f8ad9" stroke="#173b6d" stroke-width="3"/>
    <text x="560" y="309" text-anchor="middle" fill="#fff">Camera3D</text>
    <line x1="560" y1="329" x2="455" y2="375" stroke="#333" stroke-width="3"/>
    <line x1="560" y1="329" x2="665" y2="375" stroke="#333" stroke-width="3"/>
    <rect x="300" y="375" width="310" height="54" rx="6" fill="#f2332a" stroke="#7b1712" stroke-width="3"/>
    <text x="455" y="409" text-anchor="middle" fill="#fff">FireRay RayCast3D</text>
    <rect x="630" y="375" width="240" height="54" rx="6" fill="#2ea35f" stroke="#14562f" stroke-width="3"/>
    <text x="750" y="409" text-anchor="middle" fill="#fff">BlasterPreview Mesh</text>
  </g>
  <text x="450" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#333">The body rotates left/right, Head rotates up/down, Camera provides the FPS view, FireRay detects shots.</text>
</svg>
